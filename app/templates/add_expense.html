{% extends "base.html" %}
{% block title %}Add Expense{% endblock %}

{% block content %}
<h2 class="mb-4">Add Transaction</h2>

{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<form method="post" action="/expenses/add" class="card p-4" style="max-width: 500px;">
    <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" name="title" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Amount</label>
        <input type="number" step="0.01" name="amount" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Category</label>
        <input type="text" name="category" class="form-control" placeholder="e.g. Food, Rent, Salary" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Type</label>
        <select name="transaction_type" class="form-select">
            <option value="expense" selected>Expense</option>
            <option value="income">Income</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="2"></textarea>
    </div>
    <div class="form-check mb-3">
        <input type="checkbox" name="is_recurring" class="form-check-input" id="isRecurring" value="true">
        <label class="form-check-label" for="isRecurring">Recurring</label>
    </div>
    <div class="mb-3">
        <label class="form-label">Recurrence Interval</label>
        <select name="recurrence_interval" class="form-select">
            <option value="none" selected>None</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="yearly">Yearly</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
</form>
{% endblock %}
