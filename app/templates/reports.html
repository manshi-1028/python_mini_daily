{% extends "base.html" %}
{% block title %}Reports{% endblock %}

{% block content %}
<h2 class="mb-4">Reports</h2>

<div class="card p-4" style="max-width: 500px;">
    <form id="reportForm" class="mb-3">
        <div class="mb-3">
            <label class="form-label">Year</label>
            <input type="number" id="year" class="form-control" value="{{ current_month.split('-')[0] }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Month (1-12)</label>
            <input type="number" id="month" min="1" max="12" class="form-control" value="{{ current_month.split('-')[1] }}" required>
        </div>
    </form>

    <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-outline-primary" onclick="downloadReport('csv')">Download CSV</button>
        <button class="btn btn-outline-primary" onclick="downloadReport('pdf')">Download PDF</button>
        <button class="btn btn-primary" onclick="emailReport()">Email Me the PDF</button>
    </div>
    <div id="reportStatus" class="mt-3 text-muted"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function getYearMonth() {
        return { year: document.getElementById('year').value, month: document.getElementById('month').value };
    }

    function downloadReport(kind) {
        const { year, month } = getYearMonth();
        window.location.href = `/reports/${kind}?year=${year}&month=${month}`;
    }

    function emailReport() {
        const { year, month } = getYearMonth();
        const status = document.getElementById('reportStatus');
        status.innerText = 'Sending...';
        fetch(`/reports/email?year=${year}&month=${month}`, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                status.innerText = data.sent ? 'Report emailed successfully.' : 'Could not send email — check SMTP settings.';
            })
            .catch(() => { status.innerText = 'Request failed.'; });
    }
</script>
{% endblock %}
